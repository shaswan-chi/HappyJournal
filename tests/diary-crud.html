<!doctype html>
<meta charset="utf-8">
<title>HappyJournal 日记功能回归测试</title>
<h1>日记功能回归测试</h1>
<p>使用独立的临时测试数据库，不修改正式日记。刷新此页可重新测试。</p>
<pre id="result">正在测试…</pre>
<iframe title="日记测试页面" style="width:100%;height:750px"></iframe>
<script>
(async () => {
  const frame = document.querySelector('iframe'), output = document.querySelector('#result');
  const databaseName = 'HappyJournal-test-' + Date.now();
  const logs = [];
  const assert = (value, message) => { if (!value) throw new Error(message); };
  const pass = message => { logs.push('PASS ' + message); output.textContent = logs.join('\n'); };
  const wait = async check => {
    for (let i = 0; i < 150; i++) {
      if (await check()) return;
      await new Promise(resolve => setTimeout(resolve, 20));
    }
    throw new Error('界面等待超时');
  };
  let win, doc;
  const $ = selector => doc.querySelector(selector);
  const click = selector => $(selector).click();
  // 将正式网页原样装入 iframe，仅将数据库名称替换为独立测试库。
  const html = await (await fetch('../index.html')).text();
  const setup = `<script>const originalOpen = IDBFactory.prototype.open; IDBFactory.prototype.open = function(name, version) { return originalOpen.call(this, name === 'HappyJournal' ? ${JSON.stringify(databaseName)} : name, version); };<\/script>`;
  const fixture = html.replace('<head>', '<head><base href="../">' + setup);
  async function reload() {
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.srcdoc = fixture; await loaded;
    win = frame.contentWindow; doc = win.document;
    await wait(() => !$('#new-entry').disabled);
  }
  async function raw(action) {
    const db = await new Promise((resolve, reject) => {
      const r = indexedDB.open(databaseName, 1); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error);
    });
    try { return await new Promise((resolve, reject) => {
      const tx = db.transaction('entries', 'readwrite'); let result;
      const request = action(tx.objectStore('entries'));
      request.onsuccess = () => { result = request.result; };
      tx.oncomplete = () => resolve(result); tx.onabort = () => reject(tx.error);
    }); } finally { db.close(); }
  }
  const openCard = async index => { doc.querySelectorAll('.memory-card')[index].click(); await wait(() => !$('#detail-view').hidden); };
  const submit = async () => { $('#entry-form').requestSubmit(); await wait(() => $('#entry-view').hidden || $('#content-error').textContent.includes('失败')); };
  function abortWrites() {
    const original = win.IDBDatabase.prototype.transaction;
    win.IDBDatabase.prototype.transaction = function(...args) {
      const tx = original.apply(this, args);
      if (args[1] === 'readwrite') win.queueMicrotask(() => tx.abort());
      return tx;
    };
    return () => { win.IDBDatabase.prototype.transaction = original; };
  }
  try {
    await reload();
    const legacyId = await raw(store => store.add({ date: '2020-01-02', content: '旧版本正文', createdAt: '2020-01-02T03:04:05.000Z' }));
    await reload();
    assert($('.card-title').textContent === '今天的记录', '旧标题默认值错误');
    await openCard(0);
    assert($('#detail-mood').textContent.includes('平静') && $('#detail-content').textContent === '旧版本正文', '旧详情不兼容');
    const legacy = await raw(store => store.get(legacyId));
    assert(!('title' in legacy) && !('mood' in legacy), '读取旧记录时意外修改了数据库');
    pass('旧记录默认标题、心情正常；读取不改写旧数据');
    click('#back-home'); await wait(() => !$('#new-entry').disabled);
    click('#new-entry');
    $('#entry-heading').value = '测试标题'; $('#entry-mood').value = '开心';
    const fullContent = '长正文\n' + '完整内容'.repeat(60) + '<b>仍是文字</b>';
    $('#entry-content').value = fullContent;
    await submit(); await reload();
    assert(doc.querySelectorAll('.memory-card').length === 2, '新增记录未持久化');
    assert($('.card-summary').textContent.length < fullContent.length, '摘要未缩短');
    await openCard(0);
    assert($('#detail-content').textContent === fullContent && !$('#detail-content').querySelector('b'), '正文不完整或 HTML 被执行');
    const entry = (await win.journalStore.list()).find(e => e.title === '测试标题');
    pass('新增标题心情、刷新保留、摘要截断、详情完整且安全');
    click('#edit-entry'); $('#entry-heading').value = '修改标题'; $('#entry-content').value = '修改正文'; $('#entry-mood').value = '期待';
    let restore = abortWrites(); await submit(); restore();
    assert($('#content-error').textContent.includes('修改失败') && $('#entry-heading').value === '修改标题' && $('#entry-content').value === '修改正文' && $('#entry-mood').value === '期待', '修改失败未保留输入');
    assert((await win.journalStore.get(entry.id)).title === '测试标题', '失败的修改写入数据库');
    pass('编辑事务失败明确提示，保留全部输入且未改动数据库');
    await submit(); await reload(); await openCard(0);
    const updated = await win.journalStore.get(entry.id);
    assert(updated.title === '修改标题' && updated.content === '修改正文' && updated.mood === '期待', '修改未保留');
    assert(updated.createdAt === entry.createdAt && updated.date === entry.date && updated.id === entry.id && updated.updatedAt, '编辑破坏了原始创建信息');
    pass('编辑重试成功，刷新保留，原创建时间、记录日期和编号不变');
    click('#delete-entry'); click('#cancel-delete');
    assert((await win.journalStore.get(entry.id)).title === '修改标题', '取消删除仍删掉了记录');
    click('#delete-entry'); restore = abortWrites(); click('#confirm-delete');
    await wait(() => $('#detail-error').textContent.includes('删除失败')); restore();
    assert(await win.journalStore.get(entry.id), '失败删除仍改动了数据库');
    pass('取消删除不改数据；删除事务失败不误报成功');
    click('#confirm-delete'); await wait(() => !$('#memories-view').hidden); await reload();
    assert(!(await win.journalStore.list()).some(e => e.id === entry.id), '删除后刷新记录恢复');
    pass('确认删除后数据库真正移除，刷新不恢复');
    const realGet = win.journalStore.get;
    win.journalStore.get = async () => { throw new Error('模拟读取失败'); };
    $('.memory-card').click(); await wait(() => $('#home-error').textContent.includes('读取详情失败'));
    assert($('#detail-view').hidden, '读取失败却展示旧详情'); win.journalStore.get = realGet;
    const realList = win.journalStore.list;
    win.journalStore.list = async () => { throw new Error('模拟列表读取失败'); };
    click('#retry-load'); await wait(() => $('#home-error').textContent.includes('读取记录失败'));
    assert(doc.querySelectorAll('.memory-card').length === 1, '读取失败清空了已显示记录');
    win.journalStore.list = realList; click('#retry-load'); await wait(() => !$('#new-entry').disabled);
    assert(!$('#home-error').textContent, '读取重试未恢复');
    pass('详情和列表读取失败明确提示，重试后恢复');
    // 旧记录可以编辑，数据库补齐新字段，但创建时间不变。
    await openCard(0); click('#edit-entry'); $('#entry-heading').value = '   '; $('#entry-mood').value = '难过'; await submit();
    const upgraded = await win.journalStore.get(legacyId);
    assert(upgraded.title === '今天的记录' && upgraded.mood === '难过' && upgraded.createdAt === legacy.createdAt, '旧记录编辑失败');
    pass('旧记录可编辑，空标题使用默认值，保留原创建时间');
    output.textContent += '\n全部通过。';
  } catch (error) { output.textContent += '\nFAIL ' + error.message; }
  finally {
    frame.remove();
    const deletion = indexedDB.deleteDatabase(databaseName);
    deletion.onerror = () => { output.textContent += '\n测试库清理失败'; };
  }
})();
</script>
